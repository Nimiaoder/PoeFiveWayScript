# ===== 應用程式基本資訊 (version 由 Maven 於建置時填入) =====
app.name=PoeFiveWayScript
app.version=${project.version}

# ===== 自動更新 =====
# GitHub Release 來源，格式：<owner>/<repo>
# 若尚未建立 Release 倉庫，請改為 Sample/PoeFiveWayScript 並於之後換成正確值。
update.repo=Nimiaoder/PoeFiveWayScript
# GitHub API 位址 (一般不需修改；GitHub Enterprise 可改成自己的網址)
update.api.base=https://api.github.com
# 程式啟動時是否自動檢查更新 (true / false)
update.checkOnStartup=false
# 連線逾時 (秒)
update.timeoutSec=8
# Release 附件檔名比對規則 (Java 正規表示式，不分大小寫)
#   portable : 免安裝版 zip，檔名需含 "portable"
#   installer: 安裝檔 exe / msi
update.asset.portable.regex=.*portable.*\\.zip
update.asset.installer.regex=.*\\.(exe|msi)

# ===== 單一實例鎖定 (本機通訊埠) =====
single.instance.port=47213
